<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#070d1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.6"/>

  <!-- Glowing background ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.2"/>

  <!-- Stylized Oak Tree / Robles Emblem -->
  <!-- Tree Trunk & Roots -->
  <path d="M256 160 C256 220, 240 260, 230 330 C220 370, 205 380, 185 390 C220 385, 245 365, 256 335 C267 365, 292 385, 327 390 C307 380, 292 370, 282 330 C272 260, 256 220, 256 160 Z" 
        fill="#34d399" opacity="0.95" filter="url(#glow)"/>

  <!-- Oak Leaves Cluster (Top Center) -->
  <circle cx="256" cy="145" r="48" fill="url(#emeraldGrad)" opacity="0.9"/>
  
  <!-- Oak Leaves Clusters (Left & Right upper) -->
  <circle cx="205" cy="180" r="42" fill="url(#emeraldGrad)" opacity="0.85"/>
  <circle cx="307" cy="180" r="42" fill="url(#emeraldGrad)" opacity="0.85"/>

  <!-- Oak Leaves Clusters (Mid left & right) -->
  <circle cx="165" cy="230" r="38" fill="url(#emeraldGrad)" opacity="0.8"/>
  <circle cx="347" cy="230" r="38" fill="url(#emeraldGrad)" opacity="0.8"/>

  <!-- Accent geometric urbanist lines (representing urban planning grid) -->
  <line x1="140" y1="410" x2="372" y2="410" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="180" y1="424" x2="332" y2="424" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Center Hexagonal Seed/Core -->
  <polygon points="256,225 275,236 275,258 256,269 237,258 237,236" fill="#38bdf8" opacity="0.9"/>
</svg>
